<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>mr.xanax</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:image" content="pfp.png" />
  <meta name="theme-color" content="#020617" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background:
        radial-gradient(circle at 10% 10%, #2a1b6a 0, #020617 52%),
        radial-gradient(circle at 90% 90%, #0b2a7a 0, #020617 58%),
        radial-gradient(circle at 50% 120%, rgba(168, 85, 247, 0.12), transparent 55%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: -140px;
      background:
        radial-gradient(circle at 20% 20%, rgba(129, 140, 248, 0.35) 0, transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.32) 0, transparent 55%),
        radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.18) 0, transparent 60%);
      filter: blur(16px);
      opacity: 0.95;
      animation: bgFloatA 16s ease-in-out infinite alternate;
      z-index: -2;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      inset: -120px;
      background:
        radial-gradient(circle at 30% 80%, rgba(236, 72, 153, 0.14) 0, transparent 45%),
        radial-gradient(circle at 70% 30%, rgba(56, 189, 248, 0.14) 0, transparent 45%),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.02) 0px,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 2px,
          transparent 5px
        );
      mix-blend-mode: screen;
      filter: blur(10px);
      opacity: 0.7;
      animation: bgFloatB 10s ease-in-out infinite alternate;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes bgFloatA {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-28px, 18px, 0) scale(1.07); }
    }

    @keyframes bgFloatB {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(22px, -14px, 0) scale(1.05); }
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 450px;
      min-height: 550px;
      border-radius: 32px;

      background: radial-gradient(circle at top, rgba(79, 70, 229, 0.45), rgba(15, 23, 42, 0.96));
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);

      border: 1px solid rgba(129, 140, 248, 0.55);
      box-shadow:
        0 26px 80px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(15, 23, 42, 0.9) inset;

      padding-bottom: 30px;
      overflow: hidden;

      transition: box-shadow 0.35s ease, border-color 0.35s ease, background 0.35s ease;
      will-change: transform;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .card:hover {
      box-shadow:
        0 34px 95px rgba(15, 23, 42, 1),
        0 0 0 1px rgba(79, 70, 229, 0.9) inset;
      border-color: rgba(165, 180, 252, 0.75);
    }

    .banner {
      position: relative;
      margin: 20px 25px 0;
      height: 180px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(165, 180, 252, 0.8);
      box-shadow:
        0 18px 44px rgba(15, 23, 42, 0.9),
        0 0 55px rgba(129, 140, 248, 0.55);
    }

    .banner-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.05);
      /* светлее */
      filter: saturate(1.4) contrast(1.05) brightness(1.22) hue-rotate(-5deg);
      backface-visibility: hidden;
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(15, 23, 42, 0.22), rgba(15, 23, 42, 0.05)),
        radial-gradient(circle at 0% 0%, rgba(129, 140, 248, 0.38), transparent 60%);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .pfp {
      position: absolute;
      left: 45px;
      top: 150px;

      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 4px;

      background: conic-gradient(from 180deg, #38bdf8, #4f46e5, #a855f7, #38bdf8);
      box-shadow:
        0 22px 40px rgba(15, 23, 42, 0.95),
        0 0 34px rgba(129, 140, 248, 0.9);

      display: flex;
      align-items: center;
      justify-content: center;

      transition: box-shadow 0.25s ease, filter 0.25s ease;
      will-change: transform;
      backface-visibility: hidden;
      transform: translateZ(0);
      cursor: pointer;
    }

    .pfp:hover {
      box-shadow:
        0 24px 44px rgba(15, 23, 42, 0.98),
        0 0 38px rgba(168, 85, 247, 0.95);
      filter: brightness(1.05);
    }

    .pfp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(15, 23, 42, 0.9);
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .pfp.is-pressed {
      animation: pfpPress 260ms ease-out;
    }

    @keyframes pfpPress {
      0%   { transform: scale(1) translateZ(0); }
      45%  { transform: scale(0.92) rotate(-2deg) translateZ(0); }
      100% { transform: scale(1) translateZ(0); }
    }

    .content-wrapper {
      margin-top: 90px;
      padding: 0 35px;
    }

    .username-text {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #e5e7eb 0%, #a5b4fc 35%, #c4b5fd 75%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 18px rgba(15, 23, 42, 0.95);
    }

    .description {
      margin-top: 12px;
      color: rgba(226, 232, 240, 0.96);
      font-size: 14px;
      font-weight: 500;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 22px;
      padding: 18px 20px;
      background: radial-gradient(circle at top left, rgba(79, 70, 229, 0.35), rgba(15, 23, 42, 0.97));
      border-radius: 18px;
      border: 1px solid rgba(129, 140, 248, 0.65);
    }

    .stat { flex: 1; text-align: center; }
    .stat-value { font-size: 22px; font-weight: 700; color: #e5e7eb; display: block; }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(148, 163, 184, 0.95);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .social-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 30px;
      padding: 0 20px;
    }

    .social-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 18px;

      background: radial-gradient(circle at 0% 0%, rgba(79, 70, 229, 0.45), rgba(15, 23, 42, 0.96));
      backdrop-filter: blur(18px);

      border: 1px solid rgba(129, 140, 248, 0.75);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .social-button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 999px;
      background: rgba(165, 180, 252, 0.4);
      transform: translate(-50%, -50%);
      transition: width 0.45s, height 0.45s, opacity 0.45s;
      opacity: 0;
    }

    .social-button:hover::before {
      width: 120px;
      height: 120px;
      opacity: 1;
    }

    .social-button:hover {
      transform: translateY(-6px) scale(1.05) translateZ(0);
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.98);
    }

    .social-button img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      z-index: 1;
      filter: drop-shadow(0 0 8px rgba(15, 23, 42, 0.9));
      transform: translateZ(0);
    }

    .social-button.tg:hover {
      background: radial-gradient(circle at 0% 0%, #0ea5e9, #1e293b);
      border-color: rgba(56, 189, 248, 0.95);
    }
    .social-button.github:hover {
      background: radial-gradient(circle at 0% 0%, #020617, #111827);
      border-color: rgba(156, 163, 175, 0.9);
    }
    .social-button.discord:hover {
      background: radial-gradient(circle at 0% 0%, #6366f1, #111827);
      border-color: rgba(129, 140, 248, 0.95);
    }
    .social-button.other:hover {
      background: radial-gradient(circle at 0% 0%, #ec4899, #1f2937);
      border-color: rgba(244, 114, 182, 0.95);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.open { display: flex; }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
    }

    .modal-content {
      position: relative;
      z-index: 51;
      width: 100%;
      max-width: 520px;
      background: radial-gradient(circle at top, rgba(79, 70, 229, 0.5), #020617);
      border-radius: 24px;
      border: 1px solid rgba(129, 140, 248, 0.8);
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.98);
      padding: 22px 24px 20px;
      color: #e5e7eb;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-title { font-size: 18px; font-weight: 700; }

    .modal-close {
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 999px;
      transition: background 0.2s, color 0.2s, transform 0.1s;
    }

    .modal-close:hover {
      background: rgba(15, 23, 42, 0.7);
      color: #e5e7eb;
      transform: translateY(-1px);
    }

    .modal-body { font-size: 13px; }

    .client-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    .client-table tr + tr { border-top: 1px solid rgba(55, 65, 81, 0.9); }
    .client-table th, .client-table td { padding: 7px 4px; font-size: 12px; }
    .client-table th { width: 120px; text-align: left; font-weight: 600; color: #9ca3af; }
    .client-table td { word-break: break-all; }

    .client-note {
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
    }

    .badge-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.9);
    }

    @media (max-width: 500px) {
      .card { max-width: 100%; min-height: 520px; }
      .banner { margin: 15px 20px 0; height: 150px; }
      .pfp { left: 25px; top: 140px; width: 95px; height: 95px; }
      .content-wrapper { margin-top: 80px; padding: 0 25px; }
      .username-text { font-size: 24px; }
      .stats { gap: 12px; padding: 14px 16px; }
      .stat-value { font-size: 18px; }
      .social-buttons { gap: 12px; }
      .social-button { width: 50px; height: 50px; }
      .social-button img { width: 22px; height: 22px; }
      .modal-content { margin: 0 14px; padding: 18px 16px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <audio id="bg-audio" src="bg.mp3" loop autoplay preload="auto"></audio>

  <div class="card">
    <div class="banner">
      <video class="banner-video" autoplay muted loop playsinline preload="auto">
        <source src="banner.mp4" type="video/mp4" />
      </video>
      <div class="banner-overlay"></div>
    </div>

    <div class="pfp" id="pfp" data-tilt-ignore>
      <img class="pfp-img" src="pfp.png" alt="Profile picture" />
    </div>

    <div class="content-wrapper">
      <h2 class="username-text">mr.xanax</h2>

      <div class="stats">
        <div class="stat">
          <span class="stat-value">DEV</span>
          <span class="stat-label">whoami</span>
        </div>
        <div class="stat">
          <span class="stat-value">ENG</span>
          <span class="stat-label">lang</span>
        </div>
        <div class="stat">
          <span class="stat-value">12</span>
          <span class="stat-label">projects</span>
        </div>
      </div>

      <div class="social-buttons">
        <a class="social-button tg" href="https://t.me/mezapam" target="_blank" aria-label="Telegram">
          <img src="icons/tg.png" alt="Telegram" />
        </a>

        <a class="social-button github" href="https://www.roblox.com/users/11069301/profile" target="_blank" aria-label="Roblox">
          <img src="icons/rb.png" alt="Roblox" />
        </a>

        <a class="social-button discord" href="https://discord.com/users/1410547526318166076" target="_blank" aria-label="Discord">
          <img src="icons/dc.png" alt="Discord" />
        </a>

        <a class="social-button other" href="#" id="clientInfoBtn" aria-label="Client info">
          <img src="icons/info.png" alt="Client info" />
        </a>
      </div>
    </div>
  </div>

  <div class="modal" id="clientModal">
    <div class="modal-backdrop" id="clientModalBackdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">client info</div>
        <button class="modal-close" id="clientModalClose" aria-label="Close">&times;</button>
      </div>

        <table class="client-table">
          <tr><th>IP v4</th><td id="ci-ipv4">loading…</td></tr>
          <tr><th>IP v6</th><td id="ci-ipv6">loading…</td></tr>
          <tr><th>Browser</th><td id="ci-browser"></td></tr>
          <tr><th>OS</th><td id="ci-os"></td></tr>
          <tr><th>Device</th><td id="ci-device"></td></tr>
          <tr><th>Language</th><td id="ci-lang"></td></tr>
          <tr><th>Timezone</th><td id="ci-tz"></td></tr>
          <tr><th>Screen</th><td id="ci-screen"></td></tr>
          <tr><th>User agent</th><td id="ci-ua"></td></tr>
        </table>

        <div class="client-note">
        </div>
      </div>
    </div>
  </div>

  <script src="vanilla-tilt.min.js"></script>
  <script>
    (function animateTitle() {
      const frames = ["mr.xanax", "mr.xana", "mr.xan", "mr.xa", "mr.x", "mr.", "mr", "m", "‌", "m", "mr", "mr.", "mr.x", "mr.xa", "mr.xan", "mr.xana", "mr.xanax" ];
      let i = 0;
      setInterval(() => {
        document.title = frames[i % frames.length];
        i++;
      }, 200);
    })();

    VanillaTilt.init(document.querySelector(".card"), {
      max: 28,
      speed: 400,
      reverse: true,
      glare: true,
      "max-glare": 0.18,
      scale: 1.01,
      gyroscope: false
    });

    const bannerVideo = document.querySelector('.banner-video');
    if (bannerVideo) {
      const tryVideoPlay = () => bannerVideo.play().catch(() => {});
      bannerVideo.addEventListener('canplay', tryVideoPlay);
      window.addEventListener('load', tryVideoPlay);
    }

    const bgAudio = document.getElementById('bg-audio');
    if (bgAudio) {
      const tryAudioPlay = () => bgAudio.play().catch(() => {});
      window.addEventListener('load', tryAudioPlay);
      document.addEventListener('click', tryAudioPlay, { once: true });
      document.addEventListener('keydown', tryAudioPlay, { once: true });
    }

    const pfp = document.getElementById('pfp');
    if (pfp) {
      const press = () => {
        pfp.classList.remove('is-pressed');
        // reflow
        void pfp.offsetWidth;
        pfp.classList.add('is-pressed');
      };

      pfp.addEventListener('pointerdown', press);
      pfp.addEventListener('click', press);
      pfp.addEventListener('animationend', () => pfp.classList.remove('is-pressed'));
    }

    const clientBtn = document.getElementById('clientInfoBtn');
    const clientModal = document.getElementById('clientModal');
    const clientModalClose = document.getElementById('clientModalClose');
    const clientModalBackdrop = document.getElementById('clientModalBackdrop');

    function openClientModal() {
      clientModal.classList.add('open');
      loadClientInfo();
    }
    function closeClientModal() {
      clientModal.classList.remove('open');
    }

    clientBtn.addEventListener('click', (e) => {
      e.preventDefault();
      openClientModal();
    });
    clientModalClose.addEventListener('click', closeClientModal);
    clientModalBackdrop.addEventListener('click', closeClientModal);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeClientModal();
    });

    function getBrowserAndOS(ua) {
      ua = ua || '';
      let browser = 'Unknown';
      let os = 'Unknown';

      if (/edg\//i.test(ua)) browser = 'Microsoft Edge';
      else if (/opr\//i.test(ua)) browser = 'Opera';
      else if (/chrome\//i.test(ua)) browser = 'Chrome';
      else if (/safari\//i.test(ua) && !/chrome\//i.test(ua)) browser = 'Safari';
      else if (/firefox\//i.test(ua)) browser = 'Firefox';
      else if (/msie|trident/i.test(ua)) browser = 'Internet Explorer';

      if (/windows nt 10/i.test(ua)) os = 'Windows 10/11';
      else if (/windows nt 6\.3/i.test(ua)) os = 'Windows 8.1';
      else if (/windows nt 6\.2/i.test(ua)) os = 'Windows 8';
      else if (/windows nt 6\.1/i.test(ua)) os = 'Windows 7';
      else if (/mac os x/i.test(ua)) os = 'macOS';
      else if (/android/i.test(ua)) os = 'Android';
      else if (/iphone|ipad|ipod/i.test(ua)) os = 'iOS';
      else if (/linux/i.test(ua)) os = 'Linux';

      return { browser, os };
    }

    async function fetchJSON(url) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } catch {
        return null;
      }
    }

    async function loadClientInfo() {
      const ua = navigator.userAgent || '';
      const { browser, os } = getBrowserAndOS(ua);

      const w = window.screen?.width;
      const h = window.screen?.height;
      const deviceType = /mobile|android|iphone|ipad|ipod/i.test(ua) ? 'Mobile' : 'Desktop';

      const lang = navigator.language || navigator.languages?.[0] || 'unknown';
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown';

      document.getElementById('ci-browser').textContent = browser;
      document.getElementById('ci-os').textContent = os;
      document.getElementById('ci-device').textContent = deviceType;
      document.getElementById('ci-lang').textContent = lang;
      document.getElementById('ci-tz').textContent = tz;
      document.getElementById('ci-screen').textContent = w && h ? `${w} × ${h}` : 'unknown';
      document.getElementById('ci-ua').textContent = ua;

      document.getElementById('ci-ipv4').textContent = 'loading…';
      document.getElementById('ci-ipv6').textContent = 'loading…';

      const ipv4Data = await fetchJSON('https://api.ipify.org?format=json');
      document.getElementById('ci-ipv4').textContent = ipv4Data?.ip || 'unavailable';

      const ipv6Data = await fetchJSON('https://api64.ipify.org?format=json');
      document.getElementById('ci-ipv6').textContent = ipv6Data?.ip || 'unavailable';
    }
  </script>
</body>
</html>
